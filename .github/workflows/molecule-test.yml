name: molecule-test
on:
  push:
    paths:
      - 'roles/**'
      - 'molecule/**'
      - 'playbooks/**'
      - 'galaxy.yml'
      - 'meta/**'
      - 'requirements.yml'
      - 'requirements-dev.txt'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'roles/**'
      - 'molecule/**'
      - 'playbooks/**'
      - 'galaxy.yml'
      - 'meta/**'
      - 'requirements.yml'
      - 'requirements-dev.txt'
      - '.github/workflows/**'
jobs:
  test:
    name: Molecule Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: Build and install this collection locally
        run: |
          ansible-galaxy collection build --output-path /tmp/build-test
          ansible-galaxy collection install /tmp/build-test/jezmn-ansible_hardened_docker_host-*.tar.gz
      - name: Run molecule test
        run: molecule test --all
