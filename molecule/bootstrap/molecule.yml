---
dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml
driver:
  name: docker
platforms:
  - name: instance
    image: geerlingguy/docker-ubuntu2404-ansible
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup/:rw
    cgroupns_mode: host
    command: /lib/systemd/systemd

provisioner:
  name: ansible

scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy

verifier:
  name: testinfra
