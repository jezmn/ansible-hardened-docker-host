---
- name: Disable swap (if configured).
  ansible.builtin.command:
    argv:
      - swapoff
      - "{{ swap_file_path }}"
  args:
    removes: "{{ swap_file_path }}"
  when:
    - ansible_facts.memory_mb['swap']['total'] > 0
    - not swap_test_mode

- name: Ensure swap file doesn't exist (if configured).
  ansible.builtin.file:
    path: "{{ swap_file_path }}"
    state: absent
