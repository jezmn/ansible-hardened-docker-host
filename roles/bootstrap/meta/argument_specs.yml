---
argument_specs:
  main:
    short_description: Create the ansible provisioning user
    description:
      - Creates a sudo user (defaults to `ansible`) with an authorized SSH
        key and passwordless sudo, used to provision the server afterwards.
    options:
      bootstrap_user_name:
        type: str
        required: false
        default: ansible
        description: Login name of the provisioning user.
      bootstrap_user_ssh_public_key:
        type: str
        required: false
        default: ""
        description: The user's public SSH key for key-based auth.
